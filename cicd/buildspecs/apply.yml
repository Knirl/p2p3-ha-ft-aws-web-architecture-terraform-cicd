version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform 1.10.0..."
      - curl -fLO https://releases.hashicorp.com/terraform/1.10.0/terraform_1.10.0_linux_amd64.zip
      - unzip -o terraform_1.10.0_linux_amd64.zip
      - mv terraform /usr/local/bin/
      - rm terraform_1.10.0_linux_amd64.zip
      - terraform -version

  pre_build:
    commands:
      - echo "Initializing Terraform..."
      - terraform init -input=false

  build:
    commands:
      - echo "Applying Terraform Plan..."
      - terraform apply -input=false tfplan